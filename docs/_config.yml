# Site settings for GitHub Pages (Jekyll + Just the Docs theme)
# Pages source: branch "main", folder "/docs"

title: Bioinformatics 101
description: Common questions, tools and tutorials for microbial genomics
url: "https://jqbeh.github.io"
baseurl: "/Bioinformatics-101"

# Theme (pinned so the site does not change unexpectedly when the theme updates)
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

logo: "/assets/images/microbialgenomics_logo.png"
favicon_ico: "/assets/images/microbialgenomics_logo.png"
color_scheme: light

# Search box at the top of every page
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Link in the top-right corner
aux_links:
  "GitHub": "https://github.com/jqbeh/Bioinformatics-101"
aux_links_new_tab: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# "Edit this page on GitHub" link at the bottom of each page
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/jqbeh/Bioinformatics-101"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Callout boxes, e.g.  {: .note }  on the line above a paragraph
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - _figures/
  - vendor/
